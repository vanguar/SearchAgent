{#
  Переключатель режима поиска. Один и тот же вид в двух местах: на странице
  и в ответе автозаполнения профиля (там он прилетает через hx-swap-oob).
  Раньше подстановка профиля подменяла сегменты голым <select> — поле теряло
  вид на всю ширину строки. Разметка одна, различается только oob-флаг.

  mode_value — выбранный режим, mode_oob — заменять ли элемент на месте.
#}
<div
  class="seg-mode"
  id="jobs-search-mode"
  role="radiogroup"
  aria-label="Режим поиска"
  {% if mode_oob %}hx-swap-oob="true"{% endif %}
>
  <label class="seg-mode__opt">
    <input type="radio" name="search_mode" value="germany_local" {% if mode_value != "remote_worldwide" %}checked{% endif %} />
    <span>Германия</span>
  </label>
  <label class="seg-mode__opt">
    <input type="radio" name="search_mode" value="remote_worldwide" {% if mode_value == "remote_worldwide" %}checked{% endif %} />
    <span>Remote worldwide</span>
  </label>
</div>
